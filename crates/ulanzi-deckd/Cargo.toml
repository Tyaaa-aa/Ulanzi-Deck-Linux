[package]
name = "ulanzi-deckd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ulanzi-proto.workspace = true
ulanzi-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
rustix.workspace = true
inotify.workspace = true
futures-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
zbus.workspace = true
oo7.workspace = true
evdev.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = "3"
toml.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
ksni = "0.3.7"
x11rb = "0.14.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# TLS for plugin sockets: the versions tokio-tungstenite and ureq already use, with ring (as ureq).
rustls = { version = "0.23.46", default-features = false, features = ["logging", "std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = { version = "1.0.10", default-features = false }
sha2 = "0.11.1"
base64 = "0.23.1"
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-io.workspace = true
tempfile.workspace = true
zip.workspace = true
minisign-verify = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
