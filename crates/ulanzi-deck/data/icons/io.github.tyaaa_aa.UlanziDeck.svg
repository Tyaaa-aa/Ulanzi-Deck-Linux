<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset="1" stop-color="#1c1c21"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121215"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c71d8"/>
      <stop offset="1" stop-color="#613583"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- depth edge -->
  <rect x="8" y="16" width="112" height="100" rx="20" fill="url(#edge)"/>
  <!-- face -->
  <rect x="8" y="12" width="112" height="98" rx="20" fill="url(#body)"/>
  <rect x="8.5" y="12.5" width="111" height="97" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- keys: 3 x 3, the last row has the wide screen -->
  <g>
    <rect x="20" y="24" width="24" height="24" rx="6" fill="#3584e4"/>
    <rect x="52" y="24" width="24" height="24" rx="6" fill="#e01b24"/>
    <rect x="84" y="24" width="24" height="24" rx="6" fill="#33d17a"/>
    <rect x="20" y="54" width="24" height="24" rx="6" fill="#ff7800"/>
    <rect x="52" y="54" width="24" height="24" rx="6" fill="#9141ac"/>
    <rect x="84" y="54" width="24" height="24" rx="6" fill="#f6d32d"/>
    <rect x="20" y="84" width="24" height="16" rx="6" fill="#5e5c64"/>
    <rect x="52" y="84" width="56" height="16" rx="6" fill="url(#screen)"/>
  </g>
  <!-- glyphs: play, record, add / volume, night, favourite / page, now playing -->
  <g fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29 30.5 L38 36 L29 41.5 Z" stroke="#ffffff" stroke-width="2"/>
    <circle cx="64" cy="36" r="5.5"/>
    <path d="M90 36 h12 M96 30 v12" fill="none" stroke="#ffffff" stroke-width="3.4"/>
    <path d="M25.5 63 h3.5 l5 -4.5 v15 l-5 -4.5 h-3.5 Z"/>
    <path d="M36.5 62.5 a5 5 0 0 1 0 7" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M68.5 59.5 a7 7 0 1 0 0 13 a8 8 0 0 1 0 -13 Z"/>
    <path d="M96 58.6 l2.2 4.6 l5 .7 l-3.6 3.5 l.9 5 l-4.5 -2.4 l-4.5 2.4 l.9 -5 l-3.6 -3.5 l5 -.7 Z" fill="#3d3846"/>
    <path d="M29 89 l-3 3 l3 3 M35 89 l3 3 l-3 3" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  </g>
  <g fill="#ffffff">
    <rect x="59" y="90" width="2.6" height="4" rx="1.3"/>
    <rect x="63.6" y="88" width="2.6" height="8" rx="1.3"/>
    <rect x="68.2" y="89.5" width="2.6" height="5" rx="1.3"/>
    <rect x="72.8" y="87.5" width="2.6" height="9" rx="1.3"/>
    <rect x="77.4" y="90" width="2.6" height="4" rx="1.3"/>
    <rect x="86" y="89" width="16" height="2.4" rx="1.2" fill-opacity="0.85"/>
    <rect x="86" y="93" width="10" height="2" rx="1" fill-opacity="0.55"/>
  </g>
  <!-- subtle gloss on the keys -->
  <g fill="url(#gloss)">
    <rect x="20" y="24" width="24" height="24" rx="6"/>
    <rect x="52" y="24" width="24" height="24" rx="6"/>
    <rect x="84" y="24" width="24" height="24" rx="6"/>
    <rect x="20" y="54" width="24" height="24" rx="6"/>
    <rect x="52" y="54" width="24" height="24" rx="6"/>
    <rect x="84" y="54" width="24" height="24" rx="6"/>
  </g>
</svg>
