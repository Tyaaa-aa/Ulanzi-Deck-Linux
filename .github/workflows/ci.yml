name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GTK 4.16 and libadwaita 1.6 are newer than the Ubuntu runners have.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        run: |
          pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita dbus rustup \
            appstream desktop-file-utils
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Test suite
        # No display in CI: everything but the screenshot check (the service end-to-end test runs).
        run: scripts/test.sh
