[workspace]
resolver = "3"
members = ["crates/ulanzi-proto", "crates/ulanzi-core", "crates/ulanzi-plugin", "crates/ulanzi-deckd", "crates/ulanzictl", "crates/ulanzi-deck", "examples/plugins/hello", "plugins/obs", "plugins/ha", "crates/ulanzi-deckd/tests/plugins/probe", "crates/ulanzi-deckd/tests/plugins/legacy"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Tyaaa-aa/Ulanzi-Deck-Linux"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
ulanzi-proto = { path = "crates/ulanzi-proto" }
ulanzi-core = { path = "crates/ulanzi-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
serde_norway = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tiny-skia = "0.12"
resvg = "0.48"
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
include_dir = "0.7"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
evdev = "0.13"
rustix = { version = "1", features = ["fs", "process", "std"] }
inotify = "0.11"
futures-util = "0.3"
tracing = "0.1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
proptest = "1"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "component-model", "cache", "std", "parallel-compilation"] }
wasmtime-wasi = "50"
wasmtime-wasi-io = "50"
wit-bindgen = "0.63"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
